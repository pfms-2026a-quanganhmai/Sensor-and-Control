[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rosbridge-api"
version = "0.1.0"
authors = [
    { name = "Anh Minh", email = "tu.anhminh1203@gmail.com" },
]
description = "A small camera, laser scan, and cmd_vel API for rosbridge robots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "roslibpy>=2.0,<3",
]

[project.optional-dependencies]
evaluation = ["matplotlib>=3.8"]
simulation = ["mujoco>=3.2,<4"]
teleop = ["pynput>=1.7"]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.8",
    "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rosbridge_api", "src/lidar_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
